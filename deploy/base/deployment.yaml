kind: Deployment
apiVersion: apps/v1
metadata:
  name: planifica
  namespace: aesa-planifica
  labels:
    app: planifica
    app.kubernetes.io/component: planifica
    app.kubernetes.io/instance: planifica
    app.kubernetes.io/name: planifica
    app.kubernetes.io/part-of: planifica
    app.openshift.io/runtime: ruby
    app.openshift.io/runtime-namespace: aesa-planifica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planifica
  template:
    metadata:
      labels:
        app: planifica
        deployment: planifica
    spec:
      serviceAccountName: nfs-mount
      securityContext:
        fsGroup: 1002
        supplementalGroups: [999]
      volumes:
        - name: nfs-vol
          nfs:
            server: S1405-AESA
            path: /redmine_dkpre
        - name: database-config-volume
          secret:
            secretName: redmine-db-secret
            items:
              - key: database.yml
                path: database.yml
        - name: planifica-config-volume
          configMap:
            name: planifica-config
        - name: redmine-build-folder
          persistentVolumeClaim:
            claimName: redmine-build-folder
      containers:
        - name: planifica
          env:
            - name: REDMINE_PLUGINS_MIGRATE
              value: '1'
            - name: TZ
              value: 'Europe/Madrid'
          ports:
            - containerPort: 3000
              protocol: TCP
          imagePullPolicy: Always
          volumeMounts:
            - name: nfs-vol
              mountPath: /usr/src/redmine/files
            - name: database-config-volume
              mountPath: /usr/src/redmine/config/database.yml
              subPath: database.yml
            - name: planifica-config-volume
              mountPath: /usr/src/redmine/config/configuration.yml
              subPath: configuration.yml
            - name: redmine-build-folder
              mountPath: /usr/src/redmine/public/plugin_assets
          image: 'planifica:1.0.0'
      imagePullSecrets:
        - name: aesa-pull-bot-secret

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: planifica-val-deployment

namespace: aesa-planifica

resources:
  - ../../base/
  - pull-bot-secret.yaml

configMapGenerator:
  - name: planifica-config
    files:
      - configuration.yml

secretGenerator:
  - name: redmine-db-secret
    files:
      - database.yml

images:
  - name: planifica
    newName: "new-aesa-registry-quay-local-quay.apps.ocpmgm.aviacion.fomento.es/aesa/planifica/planifica"
    newTag: 5.1.11

generatorOptions:
  disableNameSuffixHash: true

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: planifica-pre-deployment

namespace: aesa-planifica

resources:
  - ../../base/
  - pull-bot-secret.yaml

configMapGenerator:
  - name: planifica-config
    files:
      - configuration.yml

secretGenerator:
  - name: redmine-db-secret
    files:
      - database.yml

images:
  - name: planifica
    newName: "new-aesa-registry-quay-local-quay.apps.ocpmgm.aviacion.fomento.es/aesa/planifica/planifica"
    newTag: 1.0.2

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      group:
      kind: Deployment
    patch: |-
      - path: /spec/template/spec/volumes/0/nfs
        op: replace
        value:
          server: S1405-AESA
          path: /redmine_dkpro
